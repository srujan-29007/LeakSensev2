# M11 sensor placement. The model is held fixed: gat_snode_noembed from M10 (chosen post hoc on
# CV, see PLAN.md M10). Features: same block as ablation_full.yaml (shares its cache).
# `leaksense place` saves each outer fold to reports/raw/placement/ as it finishes, so an
# interrupted run resumes at the next fold. Writes reports/placement.{json,md} and a curve PNG.
name: place_cpu
seed: 0
n_scenarios: null
features:
  slot: tod_weekday
  baseline_days: 14
  estimator: mean
  window: 48
  stride: 24
  max_lag_days: 7
  max_windows_per_case: 32
  pre_guard_steps: 0
  snr_holdout_days: 3.0
model:
  kind: gat
  transform: scale_magnitude
  hidden: 64
  heads: 4
  layers: 4
  node_embed: 0
  physics: node
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 256
  max_epochs: 150
  patience: 20
  val_frac: 0.15
  class_weight: inverse
  k_min: 1
  num_threads: 4
  seed: 0
placement:
  model_label: gat_snode_noembed
  k: [2, 3, 4, 6, 8, 12, 16]
  random: 100
