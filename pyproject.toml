[project]
name = "leaksense"
version = "0.1.0"
description = "Leak localization and sensor placement on the Hanoi water network (LeakDB)"
readme = "SPEC.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "torch>=2.4",
    "torch-geometric>=2.5",
    "wntr>=1.2",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
leaksense = "leaksense.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leaksense"]

[tool.uv]
# Only resolve releases at least ~2 weeks old, so the lock is reproducible and avoids fresh releases.
exclude-newer = "2026-10-24T00:00:00Z"

# CPU-only torch wheels (Linux PyPI wheels would pull CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the real dataset via LEAKSENSE_DATA_DIR (skipped when unset)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
